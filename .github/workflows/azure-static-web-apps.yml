name: Azure Static Web Apps CI/CD

on:
  # Every push to main deploys to production
  push:
    branches:
      - main
  # PRs into main auto-provision a preview environment (SWA-managed URL);
  # closing the PR cleans it up. This is our zero-cost "staging" — no
  # separate slot to maintain, works out of the box.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # Lets us trigger a build+deploy manually from any branch via the
  # Actions tab — used to smoke-test the Astro build in CI before the
  # first cutover PR is merged.
  workflow_dispatch:

concurrency:
  group: swa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        env:
          # Public env vars are inlined into the client bundle at build time.
          # Missing values fall through to the empty-string defaults in code,
          # so the site still builds even before every secret is set.
          PUBLIC_CONTACT_FLOW_URL: ${{ secrets.PUBLIC_CONTACT_FLOW_URL }}
          PUBLIC_CLARITY_ID: ${{ secrets.PUBLIC_CLARITY_ID }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.PUBLIC_PLAUSIBLE_DOMAIN }}
          PUBLIC_PLAUSIBLE_SRC: ${{ secrets.PUBLIC_PLAUSIBLE_SRC }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          # Astro builds to dist/. We pre-built above, so tell SWA not to
          # try building again — just upload dist/ as-is.
          output_location: 'dist'
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
